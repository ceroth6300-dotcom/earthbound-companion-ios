
name: EarthBound Companion iOS Unsigned Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Compile iOS host
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      IOS_PROJECT: Ports/iOS/Companion.iOS.csproj
      CONFIGURATION: Debug
      RUNTIME_IDENTIFIER: ios-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27.1
        shell: bash
        run: |
          set -euo pipefail

          XCODE="/Applications/Xcode_27.1.app"

          if [ ! -d "$XCODE" ]; then
            echo "::error::Xcode 27.1 not found"
            ls /Applications | grep Xcode || true
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" \
            >> "$GITHUB_ENV"

          export DEVELOPER_DIR="$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install iOS workload
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install ios
          dotnet workload list

      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail

          dotnet --version
          xcodebuild -version

          if [ ! -f "$IOS_PROJECT" ]; then
            echo "::error::iOS project not found"
            exit 1
          fi

          XCODE_VERSION="$(
            xcodebuild -version |
            awk '/^Xcode / {print $2}'
          )"

          if [[ "$XCODE_VERSION" != 27.1* ]]; then
            echo "::error::Expected Xcode 27.1"
            exit 1
          fi

      - name: Prepare directories
        shell: bash
        run: |
          mkdir -p diagnostics
          mkdir -p artifacts

      - name: Restore dependencies
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore "$IOS_PROJECT" \
            -p:Configuration="$CONFIGURATION" \
            -p:RuntimeIdentifier="$RUNTIME_IDENTIFIER" \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false

      - name: Compile unsigned iOS application
        shell: bash
        run: |
          set -uo pipefail

          dotnet build "$IOS_PROJECT" \
            --configuration "$CONFIGURATION" \
            --no-restore \
            -p:RuntimeIdentifier="$RUNTIME_IDENTIFIER" \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false \
            -p:BuildIpa=false \
            -p:ArchiveOnBuild=false \
            -p:TrimMode=copy \
            -v:minimal \
            -bl:diagnostics/build.binlog \
            2>&1 | tee diagnostics/build.log

          exit "${PIPESTATUS[0]}"

      - name: Package unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="Ports/iOS/bin/$CONFIGURATION/net10.0-ios/$RUNTIME_IDENTIFIER"

          echo "Searching for compiled .app bundle..."
          find "$OUTPUT" -name "*.app" -type d -print

          APP_PATH="$(
            find "$OUTPUT" -name "*.app" -type d \
              -print -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle was produced"
            echo "Output contents:"
            find "$OUTPUT" -maxdepth 4 -print \
              | head -100
            exit 1
          fi

          echo "Found app: $APP_PATH"

          APP_NAME="$(basename "$APP_PATH")"

          ditto -c -k --sequesterRsrc \
            --keepParent "$APP_PATH" \
            "artifacts/EarthBoundCompanion-iOS-Unsigned.zip"

          echo "Packaged app:"
          ls -lh artifacts/

          echo "App contents:"
          ls -la "$APP_PATH"

      - name: Upload unsigned iOS application
        uses: actions/upload-artifact@v4
        with:
          name: EarthBoundCompanion-iOS-Unsigned
          path: artifacts/EarthBoundCompanion-iOS-Unsigned.zip
          if-no-files-found: error
          retention-days: 30

      - name: Extract build errors
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          if [ -f diagnostics/build.log ]; then
            grep -Ei \
              'error |error:|failed|warning ' \
              diagnostics/build.log \
              > diagnostics/errors.txt || true

            cat diagnostics/errors.txt
          fi

      - name: Save environment information
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          dotnet --info \
            > diagnostics/dotnet-info.txt 2>&1 || true

          xcodebuild -version \
            > diagnostics/xcode-version.txt 2>&1 || true

          dotnet workload list \
            > diagnostics/workloads.txt 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14
