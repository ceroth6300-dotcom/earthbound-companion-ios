
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/ipa-staging/Payload

          if [ -z "${APP_PATH:-}" ]; then
            echo "::error::APP_PATH is missing"
            exit 1
          fi

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found"
            exit 1
          fi

          # Copy the compiled app into Payload
          ditto "$APP_PATH" \
            "artifacts/ipa-staging/Payload/$(basename "$APP_PATH")"

          # Create the IPA archive
          cd artifacts/ipa-staging

          ditto -c -k --sequesterRsrc \
            --keepParent Payload \
            ../EarthBoundCompanion-Unsigned.ipa

          # Verify the archive
          unzip -t ../EarthBoundCompanion-Unsigned.ipa
          unzip -Z -1 ../EarthBoundCompanion-Unsigned.ipa \
            | grep -q '^Payload/.*\.app/Info.plist$'

          echo "Unsigned IPA created successfully"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: EarthBoundCompanion-Unsigned-IPA
          path: artifacts/EarthBoundCompanion-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
