
name: EarthBound Companion iOS Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Check iOS project files
        run: |
          test -f Ports/iOS/AppDelegate.cs
          test -f Ports/iOS/Program.cs
          test -f Ports/iOS/Companion.iOS.csproj
          xcodebuild -version

      - name: Restore iOS project
        run: |
          dotnet restore Ports/iOS/Companion.iOS.csproj \
            -p:RuntimeIdentifier=ios-arm64

      - name: Compile iOS host
        run: |
          dotnet build Ports/iOS/Companion.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            --no-restore \
            -p:CodesignKey=-
