
name: EarthBound Companion iOS Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select and verify Xcode 26.0
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true

          test -d "$DEVELOPER_DIR"

          sudo xcode-select -s "$DEVELOPER_DIR"
          xcrun --kill-cache || true

          echo "Xcode version:"
          xcodebuild -version

          echo "Available SDKs:"
          xcodebuild -showsdks

          echo "macOS SDK:"
          MAC_SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "$MAC_SDK"
          test -d "$MAC_SDK"

          echo "iPhoneOS SDK:"
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "$IOS_SDK"
          test -d "$IOS_SDK"

          echo "macOS Clang:"
          xcrun --sdk macosx --find clang
          xcrun --sdk macosx clang --version

          echo "iPhone Clang:"
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos clang --version

          echo "Xcode verification successful"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        shell: bash
        run: |
          set -euo pipefail

          dotnet workload config \
            --update-mode manifests

          dotnet workload install ios \
            --version 10.0.100

          dotnet workload list

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f Ports/iOS/AppDelegate.cs
          test -f Ports/iOS/Program.cs
          test -f Ports/iOS/Companion.iOS.csproj

          dotnet --info

      - name: Restore iOS project
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore \
            Ports/iOS/Companion.iOS.csproj \
            -p:RuntimeIdentifier=ios-arm64

      - name: Compile iOS host
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail

          dotnet build \
            Ports/iOS/Companion.iOS.csproj \
            -c Debug \
            -f net10.0-ios \
            -r ios-arm64 \
            --no-restore \
            -p:CodesignKey=- \
            -p:BuildInParallel=false \
            -m:1 \
            -v:minimal

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            Ports/iOS/obj/project.assets.json
          if-no-files-found: ignore
