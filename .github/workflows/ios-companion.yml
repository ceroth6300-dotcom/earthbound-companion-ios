
name: EarthBound Companion iOS Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 26.0
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true

          XCODE="/Applications/Xcode_26.0.app"

          if [ ! -d "$XCODE" ]; then
            echo "ERROR: Xcode 26.0 not installed"
            exit 1
          fi

          sudo xcode-select -s \
            "$XCODE/Contents/Developer"

          xcodebuild -version

      - name: Verify Apple SDK and compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "Developer directory:"
          xcode-select -p

          echo "Available SDKs:"
          xcodebuild -showsdks

          echo "macOS SDK:"
          MAC_SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "$MAC_SDK"
          test -d "$MAC_SDK"

          echo "iPhoneOS SDK:"
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "$IOS_SDK"
          test -d "$IOS_SDK"

          echo "Clang compiler:"
          xcrun --sdk iphoneos --find clang

          echo "Xcode verification complete"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install compatible iOS workload
        shell: bash
        run: |
          set -euo pipefail

          dotnet workload config \
            --update-mode manifests

          dotnet workload install ios \
            --version 10.0.100

          dotnet workload list

      - name: Verify iOS project
        shell: bash
        run: |
          set -euo pipefail

          test -f Ports/iOS/AppDelegate.cs
          test -f Ports/iOS/Program.cs
          test -f Ports/iOS/Companion.iOS.csproj

          dotnet --info

      - name: Restore iOS project
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore \
            Ports/iOS/Companion.iOS.csproj \
            -p:RuntimeIdentifier=ios-arm64

      - name: Compile iOS host
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail

          dotnet build \
            Ports/iOS/Companion.iOS.csproj \
            -c Debug \
            -f net10.0-ios \
            -r ios-arm64 \
            --no-restore \
            -p:CodesignKey=- \
            -v:minimal

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            Ports/iOS/obj/project.assets.json
          if-no-files-found: ignore
